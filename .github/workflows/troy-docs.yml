# Checks that each English document in tstack matches its Chinese mirror, that the
# links in the README and troy-mode's documents resolve, and that living text no
# longer names the old plugin (F19 design 11.2). It runs on every PR (F19 design 5.4).
name: troy-mode docs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairs:
    name: EN/ZH pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test tstack's dev tools
        run: python3 -m unittest discover -s troy-mode/dev/tests -v
      - name: Check every EN/ZH pair
        run: python3 troy-mode/dev/check_pairs.py
      - name: Check the links and anchors in the README and troy-mode's documents
        run: python3 troy-mode/dev/check_links.py
      - name: Check that living text no longer names the old plugin
        run: python3 troy-mode/dev/check_name.py
