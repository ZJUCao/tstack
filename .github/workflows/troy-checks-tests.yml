# Runs the unit tests of troy-mode's checks (F02 design D13).
name: troy-mode checks tests
on:
  pull_request:
    paths:
      - "troy-mode/checks/**"
      - ".github/workflows/troy-checks-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s troy-mode/checks/tests -v
