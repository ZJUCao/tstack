# Runs the unit tests of troy-mode's checks (F02 design D13), of troy-init's
# engine (F06 design 11.1), of the hooks (F05 design 13.1), and of the flow
# engine and the troy-mode skill (F07 design 14.1).
name: troy-mode checks tests
on:
  pull_request:
    paths:
      - "troy-mode/checks/**"
      - "troy-mode/init/**"
      - "troy-mode/templates/**"
      - "troy-mode/lang/**"
      - "skills/troy-init/**"
      - "troy-mode/hooks/**"
      - "hooks/**"
      - "agents/**"
      - "troy-mode/flow/**"
      - "skills/troy-mode/**"
      - "troy-mode/dev/requirements-dev.lock"
      - ".github/workflows/troy-checks-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install lizard for the C/C++ adapter
        run: python -m pip install -r troy-mode/dev/requirements-dev.lock
      - name: Run unit tests
        run: python -m unittest discover -s troy-mode/checks/tests -v
      - name: Run troy-init tests
        run: python -m unittest discover -s troy-mode/init/tests -v
      - name: Run hook tests
        run: python -m unittest discover -s troy-mode/hooks/tests -v
      - name: Run flow tests
        run: python -m unittest discover -s troy-mode/flow/tests -v
