# textstats in C++: the sample project that troy-pstack's CI takes through
# the C/C++ pack (F03 design 10). troy-mode/dev/build_sample.py builds it the
# same way as the Python sample; see troy-mode/samples/python/sample.toml.

project = "textstats"
environment = "textstats-cpp"

[[commits]]
title = "[docs] Set up textstats with troy-mode"
folder = "base"

[[commits]]
title = "[F01 1/6 design] Count words in a text"
folder = "stages/1-design"
pr = "design"
# The head has no code yet, so the pack's code steps are skipped (F06 design D50).
no_code = true

[[commits]]
title = "[F01 2/6 test-plan] Count words in a text"
folder = "stages/2-test-plan"

[[commits]]
title = "[F01 3/6 mock] Count words in a text"
folder = "stages/3-mock"

[[commits]]
title = "[F01 4/6 tests] Count words in a text"
folder = "stages/4-tests"
pr = "tests"
expected = { R04 = "pass", R05 = "pass", R06 = "skip", R07 = "pass", R09 = "pass", R10 = "pass", R11 = "skip" }

[[commits]]
title = "[F01 5/6 impl] Count words in a text"
folder = "stages/5-impl"
pr = "impl"
expected = { R04 = "pass", R05 = "pass", R06 = "pass", R07 = "pass", R09 = "skip", R10 = "pass", R11 = "pass" }
