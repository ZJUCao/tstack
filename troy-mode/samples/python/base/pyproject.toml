[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "textstats"
version = "0.1.0"
description = "Prints the most frequent words of a text file. troy-pstack's sample project."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
textstats = "textstats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/textstats"]
